name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test with coverage gate
        run: pytest -q --cov=team_agent --cov-report=term --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t secure-agent-runtime:ci .
      - name: Container smoke (non-root, health, 401)
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e SERVICE_API_KEYS='[{"key":"exec-key-123456","user":"alice","role":"executor"},{"key":"admin-key-123456","user":"admin","role":"admin"}]' \
            -e DEEPSEEK_API_KEY=sk-dummy-ci \
            -e QWEN_API_KEY=sk-dummy-ci \
            -e KIMI_API_KEY=sk-dummy-ci \
            -e SERVICE_MAX_CONCURRENT_TASKS=2 \
            secure-agent-runtime:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health/live > /tmp/live.json; then break; fi
            sleep 1
          done
          cat /tmp/live.json
          python -c "import json; assert json.load(open('/tmp/live.json'))['status']=='ok'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/tasks)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong-key' http://127.0.0.1:8000/v1/tasks)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer exec-key-123456' http://127.0.0.1:8000/v1/admin/tasks)" = "403"
          test "$(docker exec agent id -u)" = "10001"
          docker exec agent python -c "import os; assert not any(k in os.environ.get('PIP_INDEX_URL','') for k in ['sk-'])"
      - name: Container logs
        if: always()
        run: docker logs agent
      - name: Stop container
        if: always()
        run: docker rm -f agent

  compose-https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose with Caddy HTTPS
        env:
          SERVICE_API_KEYS: '[{"key":"exec-key-123456","user":"alice","role":"executor"},{"key":"admin-key-123456","user":"admin","role":"admin"}]'
          DEEPSEEK_API_KEY: sk-dummy-ci
          QWEN_API_KEY: sk-dummy-ci
          KIMI_API_KEY: sk-dummy-ci
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do
            if curl -k -fsS https://localhost:8443/health/live > /tmp/live.json; then break; fi
            sleep 2
          done
          cat /tmp/live.json
          test "$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/v1/tasks)" = "401"
          test "$(curl -k -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer exec-key-123456' https://localhost:8443/v1/tasks)" = "200"
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Shutdown
        if: always()
        run: docker compose down -v
