[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-agent-runtime"
version = "1.0.0"
description = "企业 AI Agent 安全加固与受控部署（强制工具权限、API 认证、并发预算与安全部署）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "haozhouliuliuliu" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
]

[project.scripts]
secure-agent = "team_agent.cli:main"
team-agent = "team_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["team_agent"]

[tool.ruff.lint.per-file-ignores]
"src/team_agent/api.py" = ["B008"]

[tool.coverage.run]
source = ["team_agent"]
